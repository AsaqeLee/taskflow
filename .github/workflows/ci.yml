name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Unit and integration-safe tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Dependency vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Docker build
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::12} -t taskflow:${GITHUB_SHA::12} .
