name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Mongo replica set
        run: |
          docker run -d --name taskflow-ci-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all

          ready=false
          for attempt in {1..30}; do
            if docker exec taskflow-ci-mongo mongosh --quiet --host 127.0.0.1 --port 27017 --eval 'db.adminCommand({ ping: 1 }).ok' admin | grep 1 >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "${ready}" != "true" ]]; then
            echo "Mongo did not become reachable in time" >&2
            docker logs taskflow-ci-mongo >&2 || true
            exit 1
          fi

          docker exec taskflow-ci-mongo mongosh --quiet --host 127.0.0.1 --port 27017 --eval '
            try {
              if (rs.status().ok === 1) {
                quit(0)
              }
            } catch (e) {}
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})
          ' admin

          primary_ready=false
          for attempt in {1..30}; do
            if docker exec taskflow-ci-mongo mongosh --quiet --host 127.0.0.1 --port 27017 --eval 'db.hello().isWritablePrimary ? 1 : 0' admin | grep 1 >/dev/null; then
              primary_ready=true
              break
            fi
            sleep 2
          done
          if [[ "${primary_ready}" != "true" ]]; then
            echo "Mongo replica set did not elect a primary in time" >&2
            docker logs taskflow-ci-mongo >&2 || true
            exit 1
          fi

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Unit and integration-safe tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Dependency vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Validate compose config
        run: docker compose config >/dev/null

      - name: Validate production env guardrails
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          cat >"$tmpdir/users.production.json" <<'EOF'
          [
            {"id":"u_owner","name":"Owner","role":"owner","password":"Owner-Temp-456"},
            {"id":"u_alice","name":"Alice","role":"human","password":"Alice-Temp-456"}
          ]
          EOF

          cat >"$tmpdir/.env.production" <<EOF
          DEV_MODE=false
          ALLOW_PUBLIC_REGISTER=false
          STRICT_PRODUCTION_CONFIG=true
          TASK_REPOSITORY_DRIVER=mongo
          MONGODB_URI=mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DATABASE=taskflow_ci_release
          JWT_SECRET=0123456789abcdef0123456789abcdef
          APP_VERSION=${GITHUB_SHA::7}
          BOOTSTRAP_USERS_FILE=$tmpdir/users.production.json
          CORS_ALLOWED_ORIGINS=https://taskflow.internal
          EOF

          bash scripts/validate_production_env.sh "$tmpdir/.env.production"

          if bash scripts/validate_production_env.sh .env.intranet.example; then
            echo ".env.intranet.example should fail strict production validation" >&2
            exit 1
          fi

      - name: Mongo migrate smoke
        env:
          DEV_MODE: "false"
          TASK_REPOSITORY_DRIVER: mongo
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DATABASE: taskflow_ci_migrate
          JWT_SECRET: ci-secret-must-be-at-least-32-chars
          APP_VERSION: ci
          LOG_LEVEL: info
        run: go run ./cmd/migrate

      - name: Mongo integration coverage
        env:
          TASKFLOW_MONGO_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: go test -count=1 -p 1 ./internal/migrations ./internal/middleware ./internal/handler ./internal/repository ./internal/service

      - name: Frontend production bundle smoke
        run: bash scripts/web_build_smoke.sh

      - name: Compose build and smoke
        run: bash scripts/compose_smoke.sh

      - name: Intranet acceptance (incremental)
        run: bash scripts/intranet_acceptance.sh

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color mongo mongo-init migrate taskflow otel-collector || true

      - name: Compose cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
