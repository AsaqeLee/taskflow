x-build-args: &app-build-args
  APP_VERSION: ${APP_VERSION:-compose-local}

x-common-env: &common-env
  PORT: "${PORT:-8080}"
  DEV_MODE: "${DEV_MODE:-false}"
  ALLOW_PUBLIC_REGISTER: "${ALLOW_PUBLIC_REGISTER:-false}"
  STRICT_PRODUCTION_CONFIG: "${STRICT_PRODUCTION_CONFIG:-false}"
  TASK_REPOSITORY_DRIVER: "${TASK_REPOSITORY_DRIVER:-mongo}"
  MONGODB_URI: "${MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0}"
  MONGODB_DATABASE: "${MONGODB_DATABASE:-taskflow}"
  JWT_SECRET: "${JWT_SECRET:-compose-local-secret-must-be-at-least-32-chars}"
  APP_VERSION: "${APP_VERSION:-compose-local}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"

x-runtime-env: &runtime-env
  <<: *common-env
  ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-2h}"
  REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-168h}"
  PASSWORD_RESET_TTL: "${PASSWORD_RESET_TTL:-1h}"
  REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-15s}"
  SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
  SERVER_READ_TIMEOUT: "${SERVER_READ_TIMEOUT:-10s}"
  SERVER_WRITE_TIMEOUT: "${SERVER_WRITE_TIMEOUT:-30s}"
  RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-120}"
  RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-1m}"
  LOGIN_RATE_LIMIT_REQUESTS: "${LOGIN_RATE_LIMIT_REQUESTS:-10}"
  LOGIN_RATE_LIMIT_WINDOW: "${LOGIN_RATE_LIMIT_WINDOW:-5m}"
  PASSWORD_RESET_RATE_LIMIT_REQUESTS: "${PASSWORD_RESET_RATE_LIMIT_REQUESTS:-5}"
  PASSWORD_RESET_RATE_LIMIT_WINDOW: "${PASSWORD_RESET_RATE_LIMIT_WINDOW:-15m}"
  IDEMPOTENCY_TTL: "${IDEMPOTENCY_TTL:-10m}"
  TRACING_ENABLED: "${TRACING_ENABLED:-true}"
  TRACING_ENDPOINT: "${TRACING_ENDPOINT:-otel-collector:4318}"
  TRACING_INSECURE: "${TRACING_INSECURE:-true}"
  TRACING_SERVICE_NAME: "${TRACING_SERVICE_NAME:-taskflow}"

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - taskflow_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --port 27017 --eval 'db.adminCommand({ ping: 1 }).ok' admin || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mongosh --quiet --host mongo --port 27017 --eval '
          try {
            if (rs.status().ok === 1) {
              quit(0)
            }
          } catch (e) {}
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})
        ' admin
        until mongosh --quiet --host mongo --port 27017 --eval 'db.hello().isWritablePrimary ? 1 : 0' admin | grep 1 >/dev/null; do
          sleep 2
        done

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
      - "13133:13133"

  migrate:
    build:
      context: .
      args: *app-build-args
    restart: "no"
    entrypoint: ["/usr/local/bin/taskflow-migrate"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment: *runtime-env

  bootstrap:
    build:
      context: .
      args: *app-build-args
    restart: "no"
    entrypoint: ["/usr/local/bin/taskflow-bootstrap"]
    command: ["-users", "/bootstrap/users.json"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${BOOTSTRAP_USERS_FILE:-./scripts/users.example.json}:/bootstrap/users.json:ro
    environment:
      <<: *common-env
      USERS_FILE: /bootstrap/users.json

  taskflow:
    build:
      context: .
      args: *app-build-args
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *runtime-env
      # Leave empty for same-origin nginx (`--profile full`) or Vite dev proxy.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    profiles: ["full"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      taskflow:
        condition: service_healthy
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  taskflow_mongo_data:
